name: Deploy
on:
  push: { branches: [main] }

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/citylogic/shapshap:sha-${{ github.sha }}
            ghcr.io/citylogic/shapshap:latest

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.SSH_DEPLOY_KEY }}
          script: |
            cd ~/shapshap
            sed -i "s|^TAG=.*|TAG=sha-${{ github.sha }}|" .env
            docker compose pull
            docker compose up -d
            sleep 45
            app_id="$(docker compose ps -q app)"
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$app_id")"
            if [ "$status" != healthy ]; then
              echo "app health is ${status}"
              exit 1
            fi
            docker image prune -f
